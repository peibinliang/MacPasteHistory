name: MacPasteHistory
options:
  bundleIdPrefix: com.peibin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2
targets:
  MacPasteHistory:
    type: application
    platform: macOS
    sources:
      - path: MacPasteHistory
    resources:
      - path: MacPasteHistory/Resources
    dependencies:
      - sdk: libsqlite3.tbd
      - package: Sparkle
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peibin.MacPasteHistory
        PRODUCT_NAME: "粘易"
        PRODUCT_MODULE_NAME: MacPasteHistory
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MacPasteHistory/MacPasteHistory.entitlements
        INFOPLIST_FILE: MacPasteHistory/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
          COPY_PHASE_STRIP: YES
          STRIP_STYLE: non-global
          DEPLOYMENT_POSTPROCESSING: YES
          ENABLE_DEBUG_DYLIB_SUPPORT: NO
  MacPasteHistoryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacPasteHistoryTests
    dependencies:
      - target: MacPasteHistory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peibin.MacPasteHistoryTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/粘易.app/Contents/MacOS/粘易"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MacPasteHistory:
    build:
      targets:
        MacPasteHistory: all
        MacPasteHistoryTests: [test]
    test:
      targets:
        - MacPasteHistoryTests
